name: Security & Vulnerability Scans

on:
  workflow_dispatch:
  pull_request:
    branches: [main, master]

permissions:
  contents: read
  pull-requests: read
  security-events: write

jobs:
  semgrep-sast:
    name: Semgrep SAST
    runs-on: ubuntu-latest
    # The official image ships a tested semgrep-core. pip's latest (1.186.0) crashed
    # with exit -11 on this repo and still reported success.
    container:
      image: semgrep/semgrep
    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # --no-suppress-errors: an engine crash fails the job instead of passing it.
      - name: Run Semgrep CI
        run: semgrep ci --no-suppress-errors
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}

  trivy-sca:
    name: Trivy Dependency & Misconfig Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # trivy-action caches $GITHUB_WORKSPACE/.cache/trivy and sets
      # TRIVY_CACHE_DIR there. A separate cache of ~/.cache/trivy never
      # reaches the directory the scan reads.
      - name: Run Trivy Filesystem Scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          severity: 'HIGH,CRITICAL'
          exit-code: '1'
          ignore-unfixed: true